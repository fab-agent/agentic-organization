# Egress proxy for the workstation sandbox (ADR-0002 / ADR-0010 layer 3).
#
# The sandbox container has no route to the internet (compose `internal`
# network); this proxy is its only way out, and it forwards ONLY to hosts that
# match /etc/tinyproxy/filter (rendered from the allowlist by entrypoint.sh).

Port 8888
Listen 0.0.0.0
Timeout 600
PidFile "/tmp/tinyproxy.pid"

# Client ACL. The real isolation is the internal-only network — only the sandbox
# can reach this port — so allowing the private ranges here is sufficient.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Allowlist. FilterDefaultDeny => anything not matched by the filter is refused.
# FilterExtended = POSIX extended regex (tinyproxy 1.11.x; renamed FilterType in
# a later release — revisit if the base image bumps tinyproxy).
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterCaseSensitive Off
FilterDefaultDeny Yes

# HTTPS is CONNECT-tunnelled; the filter still applies to the target host.
ConnectPort 443
ConnectPort 8443

DisableViaHeader Yes
LogLevel Connect
