# docker-compose.cloud.yml — Alibaba Cloud ECS production deployment
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d --build
#
# Difference from base:
#   - No volume mount of source code (use built image)
#   - Frontend built with VITE_API_URL pointing to the cloud domain
#   - Named volumes for persistence
#   - No exposed ports — Nginx reverse-proxy handles all traffic

version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agentic}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      - POSTGRES_DB=${POSTGRES_DB:-agentic}
    volumes:
      - agent_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic} -d ${POSTGRES_DB:-agentic}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-backend
    volumes:
      - agent_data:/app/data
      - agent_logs:/app/logs
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentic}
      - ENVIRONMENT=production
    env_file:
      - path: ./backend/.env
        required: true
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: agent-frontend
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      backend:
        condition: service_healthy

volumes:
  agent_data:
    driver: local
  agent_logs:
    driver: local
  agent_db:
    driver: local
