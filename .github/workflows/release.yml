name: Release

# Tag-driven release of the workstation-agent layer (ADR-0012):
#   - sandbox + egress container images  -> GHCR
#   - `3pa` CLI single-file bundle       -> GitHub Release asset
#   - `3pa` CLI + agent-plugin packages  -> GitHub Packages (npm)
#
# Backend / frontend images stay on the compose build-local flow for now.
#
#   git tag v1.4.0 && git push origin v1.4.0
# A manual run builds and tests everything and never publishes unless dry_run is
# set to false AND the selected ref is a version tag.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test everything but do not push / publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      latest: ${{ steps.v.outputs.latest }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v${num}\.${num}\.${num}(-${ident}(\.${ident})*)?\$"
          publish=false
          latest=false
          prerelease=false
          version="0.0.0-dev.$(date +%s)"
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq "$semver"; then
              echo "Tag '$REF_NAME' is not a SemVer version tag (vMAJOR.MINOR.PATCH[-prerelease])" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
            case "$version" in *-*) prerelease=true ;; esac
            if [ "$EVENT" = "push" ] || [ "$DRY_RUN" = "false" ]; then
              publish=true
              case "$version" in
                *-*) ;;
                *)
                  # `latest` only moves forward: this tag must be the highest stable one.
                  top=$(git tag -l 'v*' | grep -E "^v${num}\.${num}\.${num}\$" | sort -V | tail -n1)
                  if [ "$top" = "$REF_NAME" ]; then latest=true; fi
                  ;;
              esac
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  images-check:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sandbox
            context: .
            file: sandbox/Dockerfile
          - name: egress
            context: sandbox/egress
            file: sandbox/egress/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          provenance: false
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          cache-from: type=gha,scope=${{ matrix.name }}

  cli-bundle:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - working-directory: packages/cli
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm ci --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run typecheck
          npm test
          npm run bundle
          test "$(node dist/3pa.mjs --version)" = "$VERSION"
          sha256sum dist/3pa.mjs | tee dist/3pa.mjs.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 3pa-cli
          path: packages/cli/dist/3pa.mjs*

  plugin-check:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/agent-plugin/package-lock.json
      - working-directory: packages/agent-plugin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  pack:
    needs: [version, plugin-check, cli-bundle, images-check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [agent-plugin, cli]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Version, build and pack ${{ matrix.pkg }} (no registry credentials)
        working-directory: packages/${{ matrix.pkg }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm ci --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          mkdir -p ../../out
          npm pack --pack-destination ../../out
      - name: Smoke-install the tarball
        env:
          PKG: ${{ matrix.pkg }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir smoke && cd smoke && npm init -y >/dev/null
          npm install --no-audit --no-fund ../out/*.tgz
          if [ "$PKG" = "cli" ]; then test "$(./node_modules/.bin/3pa --version)" = "$VERSION"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.pkg }}
          path: out/*.tgz

  images-publish:
    needs: [version, pack]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: sandbox
            context: .
            file: sandbox/Dockerfile
          - name: egress
            context: sandbox/egress
            file: sandbox/egress/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          tags: |
            ${{ env.IMAGE_NS }}/agentic-org-${{ matrix.name }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.latest == 'true' && format('{0}/agentic-org-{1}:latest', env.IMAGE_NS, matrix.name) || '' }}

  npm-publish:
    needs: [version, pack]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        pkg: [agent-plugin, cli]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-${{ matrix.pkg }}
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
      - name: Publish the exact tarball (scripts disabled)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ needs.version.outputs.latest == 'true' && 'latest' || (needs.version.outputs.prerelease == 'true' && 'next' || 'maintenance') }}
        run: npm publish out/*.tgz --ignore-scripts --tag "$DIST_TAG"

  release:
    needs: [version, npm-publish, images-publish, cli-bundle]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 3pa-cli
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/3pa.mjs*
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.latest == 'true' }}
          body: |
            ## Container images
            - `${{ env.IMAGE_NS }}/agentic-org-sandbox:${{ needs.version.outputs.version }}`
            - `${{ env.IMAGE_NS }}/agentic-org-egress:${{ needs.version.outputs.version }}`

            ## `3pa` CLI
            - `dist/3pa.mjs` — single-file bundle (`node >=20`), `sha256` alongside
            - GitHub Packages: `@fab-agent/cli@${{ needs.version.outputs.version }}`

            See `docs/architecture/version-compat.md` for the compatibility matrix.
