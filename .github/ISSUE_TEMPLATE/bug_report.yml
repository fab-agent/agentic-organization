name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or real company data. For security problems use SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend API, Web UI, Terminal client / plugin, Gateway / policy / audit, Install / deploy, Docs]
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
