name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Alternatives you considered?
  - type: checkboxes
    id: adr
    attributes:
      label: Decision impact
      options:
        - label: This may change an architectural decision (needs an ADR, see docs/adr/)
